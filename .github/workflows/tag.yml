name: Tag

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tag the pushed commit with the changelog's newest version, unless that tag exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(gh api "repos/$GITHUB_REPOSITORY/contents/CHANGELOG.md?ref=$GITHUB_SHA" -H "Accept: application/vnd.github.raw" |
            grep -m1 -oP '^## \[\K[0-9]+\.[0-9]+\.[0-9]+(?=\])')
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" --silent 2>/dev/null ||
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$version" -f sha="$GITHUB_SHA" --silent
