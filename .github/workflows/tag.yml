# Tags each push to main with the newest version in CHANGELOG.md. The
# changelog follows Keep a Changelog, so the first "## [x.y.z]" heading
# below "## [Unreleased]" is the latest release. The versions follow
# Semantic Versioning, and the tag is that version with a "v" prefix,
# like v1.4.0. An existing tag is never moved.

name: Tag

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tag-main
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Tag the pushed commit with the changelog's newest version, unless that tag exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(gh api "repos/$GITHUB_REPOSITORY/contents/CHANGELOG.md?ref=$GITHUB_SHA" -H "Accept: application/vnd.github.raw" |
            grep -m1 -oP '^## \[\K[0-9]+\.[0-9]+\.[0-9]+(?=\])')
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" --silent 2>/dev/null ||
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$version" -f sha="$GITHUB_SHA" --silent
