# Checks branch names against Conventional Branch 1.1.0. GitHub's own
# "Restrict branch names" ruleset rule needs GitHub Enterprise, and the
# organization is on Free, so this check stands in for it.
#
# It runs on push only. The "Owner pushes only" Actions policy refuses
# pull_request runs, and the push run already gives each PR its check.

name: Branch name

on:
  push:
    branches-ignore: [main]

permissions: {}

jobs:
  branch-name:
    name: Branch name
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-slim
    timeout-minutes: 2

    steps:
      - name: Validate branch name
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          LC_ALL: C

        run: |
          if [[ "$ACTOR" == "dependabot[bot]" && "$BRANCH" == dependabot/* ]]; then
            echo "Allowed Dependabot branch: $BRANCH"

          elif [[ "$BRANCH" =~ ^(feat|fix|chore|release)/[a-z0-9]+([.-][a-z0-9]+)*$ ]]; then
            echo "Valid branch name: $BRANCH"

          else
            printf '::error title=Invalid branch name::Expected <type>/<description> (feat, fix, chore, release); use lowercase letters, numbers, hyphens, or dots. Got: %s\n' "$BRANCH"
            exit 1
          fi
